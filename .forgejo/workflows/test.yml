name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Test:
    runs-on: debian
    steps:
    - uses: actions/checkout@v3
    - name: Install Packages
      run: yarn
    - name: Run TypeScript Compiler
      run: yarn build
    - name: Run Vitest
      run: yarn test