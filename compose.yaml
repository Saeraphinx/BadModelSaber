services:
  bms-backend:
    image: git.sae.sh/saeraphinx/badmodelsaber-backend:latest
    container_name: bms-be
    environment:
      - DISCORD_CLIENT_ID=
      - DISCORD_CLIENT_SECRET=
      - PORT=6001
      - BACKEND_URL=http://localhost:6001
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGIN=default
      - CORS_ALLOW_CREDENTIALS=true

      - TRUST_PROXY=false
      - STORED_SESSION_TIMEOUT=604800000 # 7 days in milliseconds
      - SESSION_SECRET=your_session_cookie_secret

      - DB_CONNECTION_STRING=postgres://username:password@hostname:port/dbname
    volumes:
      - ./storage:/app/storage
    ports:
      - 6001:6001
    restart: unless-stopped
  bms-frontend:
    image: git.sae.sh/saeraphinx/badmodelsaber-frontend:latest
    container_name: bms-fe
    environment:
      - PUBLIC_BASE_URL=http://localhost:3000
      - PUBLIC_API_URL=http://localhost:6001/api
      - PUBLIC_FILE_URL=http://localhost:6001/files
    ports:
      - 3000:3000
    restart: unless-stopped  